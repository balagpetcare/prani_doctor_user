name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare release signing and Firebase
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          else
            echo "KEYSTORE_BASE64 not configured — AAB build will be skipped"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      - name: Build App Bundle
        if: github.event_name != 'pull_request'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ENABLE_PUSH: ${{ vars.ENABLE_PUSH || 'true' }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || 'https://pranidoctor.com/privacy' }}
          CRASH_REPORTING_WEBHOOK_URL: ${{ secrets.CRASH_REPORTING_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || vars.APP_VERSION }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$API_BASE_URL" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "Release tags require KEYSTORE_BASE64 and API_BASE_URL secrets"
              exit 1
            fi
            echo "Skip AAB build: require KEYSTORE_BASE64 and API_BASE_URL secrets"
            exit 0
          fi
          flutter build appbundle --release \
            --dart-define=APP_ENV=production \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=ENABLE_PUSH="${ENABLE_PUSH}" \
            --dart-define=LOG_NETWORK=false \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL}" \
            $(if [ -n "${CRASH_REPORTING_WEBHOOK_URL}" ]; then echo "--dart-define=CRASH_REPORTING_WEBHOOK_URL=${CRASH_REPORTING_WEBHOOK_URL}"; fi) \
            $(if [ -n "${SENTRY_DSN}" ]; then echo "--dart-define=SENTRY_DSN=${SENTRY_DSN}"; fi) \
            $(if [ -n "${APP_VERSION}" ]; then echo "--dart-define=APP_VERSION=${APP_VERSION}"; fi)

      - name: Upload App Bundle
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$API_BASE_URL" ]; then
            echo "No AAB artifact to upload"
            exit 0
          fi
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload App Bundle artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload debug symbols
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/
          if-no-files-found: ignore

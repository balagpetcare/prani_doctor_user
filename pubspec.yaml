name: pranidoctor_user
description: PraniDoctor end-user Flutter app (enterprise architecture).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.3.2
  firebase_messaging: ^15.1.5
  sentry_flutter: ^8.14.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.4.0
  file_picker: ^8.1.7
  speech_to_text: ^7.0.0
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/i18n/
    - assets/brand/app_icons/
    - assets/brand/logos/
    - assets/brand/illustrations/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/seeds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icons/prani_doctor_app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/app_icons/prani_doctor_app_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: false
  fullscreen: true
  android_12:
    color: "#FFFFFF"

name: pranidoctor_user
description: PraniDoctor end-user Flutter app (enterprise architecture).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
